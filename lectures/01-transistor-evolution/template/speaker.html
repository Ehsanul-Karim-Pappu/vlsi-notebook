<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speaker view</title>
  <style>
    @font-face { font-family: Inter; font-weight: 400; src: url("labs/fonts/Inter-Regular.ttf") format("truetype"); }
    @font-face { font-family: Inter; font-weight: 500; src: url("labs/fonts/Inter-Medium.ttf") format("truetype"); }
    @font-face { font-family: Inter; font-weight: 600 700; src: url("labs/fonts/Inter-SemiBold.ttf") format("truetype"); }
    @font-face { font-family: "Noto Sans Bengali"; font-weight: 400; src: url("labs/fonts/NotoSansBengali-Regular.ttf") format("truetype"); }
    @font-face { font-family: "Noto Sans Bengali"; font-weight: 500; src: url("labs/fonts/NotoSansBengali-Medium.ttf") format("truetype"); }
    @font-face { font-family: "Noto Sans Bengali"; font-weight: 600 700; src: url("labs/fonts/NotoSansBengali-SemiBold.ttf") format("truetype"); }
    :root {
      --bg: #0E1116; --panel: #171B22; --ink: #ECE8E1; --muted: #8A8F98; --faint: #3A3F47;
      --gate: #F2B84B; --good: #7BD389; --electron: #4FC7D8; --drain: #E8553E;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 400 16px/1.45 Inter, "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { display: grid; grid-template-rows: auto auto 1fr auto auto; gap: 14px; padding: 18px 22px; }

    .top { display: flex; align-items: baseline; gap: 18px; }
    .count { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .count small { color: var(--muted); font-size: 18px; font-weight: 500; }
    .where { color: var(--gate); font-weight: 600; font-size: 15px; letter-spacing: .04em; }
    .spacer { flex: 1; }
    .clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 18px; }
    .timer { font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 700; }

    /* The animation bar: fills while the slide's animation plays; green when it's done. */
    .anim { background: var(--panel); border-radius: 12px; padding: 12px 16px 14px; }
    .anim .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .anim .state { font-size: 20px; font-weight: 600; }
    .anim .secs { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
    .track { height: 22px; border-radius: 11px; background: var(--faint); overflow: hidden; }
    .fill { height: 100%; width: 0; background: var(--gate); border-radius: 11px; }
    .anim.playing .state { color: var(--gate); }
    .anim.done .state, .anim.done .secs { color: var(--good); }
    .anim.done .fill { background: var(--good); }
    .anim.loop .state { color: var(--electron); }
    .anim.loop .fill { background: var(--electron); }
    .anim.paused .state { color: var(--drain); }
    .anim.idle .state { color: var(--muted); }

    /* Notes on the left; what's on screen now and what comes next on the right. */
    .main { display: grid; grid-template-columns: 1fr auto; gap: 14px; min-height: 0; }
    .previews { display: flex; flex-direction: column; gap: 10px;
      width: min(34vw, calc((100vh - 400px) * 0.88)); min-width: 220px; }
    .pv-label { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; margin-bottom: 4px; }
    .frame { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 8px;
      overflow: hidden; border: 1px solid var(--faint); }
    .frame video, .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .frame .ph { position: absolute; inset: 0; display: none; place-items: center; padding: 10px;
      text-align: center; color: var(--muted); font-weight: 600; font-size: 15px; background: var(--panel); }
    .frame .ph.show { display: grid; }
    .notes { background: var(--panel); border-radius: 12px; padding: 16px 20px; overflow: auto;
      font-size: 23px; line-height: 1.5; }
    .notes p { margin: 0 0 .6em; }
    .notes .empty { color: var(--muted); }
    .notes .bn { font-family: "Noto Sans Bengali", Inter, sans-serif; }
    /* The notes language switch: English or Bangla, one at a time. */
    #lang { display: flex; gap: 2px; padding: 4px; }
    #lang span { padding: 6px 12px; border-radius: 7px; color: var(--muted); }
    #lang span.on { background: var(--gate); color: var(--bg); }
    #lang .bn { font-family: "Noto Sans Bengali", Inter, sans-serif; }

    .next { color: var(--muted); font-size: 17px; }
    .next b { color: var(--ink); font-weight: 600; }
    .next .bn { font-family: "Noto Sans Bengali", Inter, sans-serif; }
    .next .down { color: var(--gate); font-weight: 600; margin-left: 10px; }

    .keys { display: flex; gap: 10px; align-items: center; }
    .keys button { white-space: nowrap; }
    button { font: inherit; font-weight: 600; font-size: 16px; color: var(--ink); background: var(--panel);
      border: 1px solid var(--faint); border-radius: 10px; padding: 10px 18px; cursor: pointer; }
    button.go { background: var(--gate); color: var(--bg); border-color: var(--gate); padding: 10px 34px; }
    .hint { color: var(--muted); font-size: 13px; }
    .lost { position: fixed; inset: 0; display: none; place-items: center; background: rgba(14,17,22,.92);
      font-size: 22px; text-align: center; padding: 40px; }
    .lost.show { display: grid; }
  </style>
</head>
<body>
  <div class="top">
    <div class="count" id="count">– <small>/ –</small></div>
    <div class="where" id="where"></div>
    <div class="spacer"></div>
    <div class="clock" id="clock"></div>
    <div class="timer" id="timer" title="Time since you opened this window">00:00</div>
    <button id="reset" title="Restart the timer">Reset</button>
    <button id="lang" title="Notes in English or Bangla (L)"><span data-lang="en">EN</span><span data-lang="bn" class="bn">বাংলা</span></button>
  </div>

  <div class="anim idle" id="anim">
    <div class="row"><div class="state" id="state">Waiting for the deck…</div><div class="secs" id="secs"></div></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <div class="main">
    <div class="notes" id="notes"><span class="empty">No notes for this slide.</span></div>
    <div class="previews">
      <div><div class="pv-label">Now</div>
        <div class="frame"><video id="nowVid" muted playsinline></video><div class="ph" id="nowPh"></div></div></div>
      <div><div class="pv-label">Next</div>
        <div class="frame"><img id="nextImg" alt=""><div class="ph" id="nextPh"></div></div></div>
    </div>
  </div>

  <div class="next" id="next"></div>

  <div class="keys">
    <button id="prev">◀ Back</button>
    <button id="go" class="go">Next ▶</button>
    <button id="down">↓ Derivation</button>
    <button id="toggle">Pause / play</button>
    <div class="spacer"></div>
    <div class="hint">Keys work here too: → ← next / back · ↓ ↑ derivation · Space pause · L notes language · Page Down / Up for a clicker</div>
  </div>

  <div class="lost" id="lost">The deck window is closed or was reloaded.<br>Go back to the deck and press S to reopen this view.</div>

  <script>
  (function () {
    const deck = window.opener;
    const $ = (id) => document.getElementById(id);
    const send = (go) => { if (deck && !deck.closed) deck.postMessage({ type: "deck", go }, "*"); };
    if (!deck) $("lost").classList.add("show");

    // Notes come in English and Bangla; the switch (or L) shows one at a time, and is remembered.
    let mode = "en";
    try { if (localStorage.getItem("notes-lang") === "bn") mode = "bn"; } catch (e) {}
    let notes = { en: "", bn: "" };

    const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const paras = (t) => t.split(/\n\s*\n/).map((p) => p.replace(/\s+/g, " ").trim()).filter(Boolean)
      .map((p) => "<p>" + esc(p) + "</p>").join("");
    function showNotes() {
      document.querySelectorAll("#lang span").forEach((el) => el.classList.toggle("on", el.dataset.lang === mode));
      const t = notes[mode];
      $("notes").innerHTML = t ? '<div class="' + mode + '" lang="' + mode + '">' + paras(t) + "</div>"
                               : '<span class="empty">No notes for this slide.</span>';
      fitNotes();
    }
    // Shrink the notes until they fit the box, so a long script never needs scrolling mid-talk.
    function fitNotes() {
      const box = $("notes");
      let size = 23;
      box.style.fontSize = size + "px";
      while (box.scrollHeight > box.clientHeight + 2 && size > 15) box.style.fontSize = --size + "px";
    }
    window.addEventListener("resize", fitNotes);
    // "Up next": the start of the next slide's notes, in the language the notes are in.
    let upNext = null;
    function showUpNext() {
      const s = upNext;
      if (!s) return;
      const t = s.next && (s.next[mode] || s.next.en);
      let html = t ? "Up next: <b" + (mode === "bn" ? ' class="bn"' : "") + ">" + esc(t) + "</b>" : s.last ? "This is the last slide." : "";
      if (s.hasDown) html += '<span class="down">' + (s.vertical ? "↓ the next step is below" : "↓ a derivation sits below this slide") + "</span>";
      $("next").innerHTML = html;
    }
    function toggleLang() {
      mode = mode === "en" ? "bn" : "en";
      try { localStorage.setItem("notes-lang", mode); } catch (e) {}
      showNotes();
      showUpNext();
      fitNotes();
    }
    showNotes();

    window.addEventListener("message", (e) => {
      const s = e.data;
      if (!s || s.type !== "deck-state") return;
      $("lost").classList.remove("show");
      if (s.notes !== undefined) {
        $("count").innerHTML = s.index + " <small>/ " + s.total + "</small>";
        $("where").textContent = s.vertical ? "DERIVATION " + s.v + " OF " + s.stack : s.kind === "lab" ? "LIVE LAB" : "";
        notes = s.notes;
        showNotes();
        $("notes").scrollTop = 0;
        upNext = s;
        showUpNext();
        $("down").disabled = !s.hasDown;
        fitNotes();  // again: the "Up next" line can change the notes box's height
        showNext(s.upcoming, s.last);
      }
      if (s.now !== undefined) nowSlide = s.now;
      mirror(s);
      anim(s);
    });

    // "Now": the current slide's video, muted, kept in step with the deck's.
    let nowSlide = null;
    const vid = $("nowVid");
    function mirror(s) {
      const want = nowSlide && nowSlide.video;
      if (!want) {
        if (vid.getAttribute("src")) { vid.pause(); vid.removeAttribute("src"); vid.load(); }
        $("nowPh").textContent = nowSlide && nowSlide.lab !== undefined ? (nowSlide.lab || "Live lab") + " (on screen)" : "";
        $("nowPh").classList.toggle("show", !!nowSlide);
        return;
      }
      $("nowPh").classList.remove("show");
      if (vid.getAttribute("src") !== want) {
        vid.poster = nowSlide.thumb;
        vid.src = want;
      }
      vid.loop = !!s.loop;
      if (!(s.d > 0) || vid.readyState < 1) return;
      if (Math.abs(vid.currentTime - s.t) > 0.3) vid.currentTime = s.t;
      if (s.paused || s.ended) { if (!vid.paused) vid.pause(); }
      else if (vid.paused) vid.play().catch(() => {});
    }
    // "Next": the last frame of the slide → goes to, so you can see what it builds to.
    function showNext(p, last) {
      const img = $("nextImg"), ph = $("nextPh");
      if (p && p.thumb) { img.src = p.thumb; img.style.display = ""; ph.classList.remove("show"); return; }
      img.removeAttribute("src"); img.style.display = "none";
      ph.textContent = p ? (p.lab || "Live lab") : last ? "End of the deck" : "";
      ph.classList.add("show");
    }

    function anim(s) {
      const box = $("anim");
      let cls = "idle", state = "", secs = "", pct = 0;
      const left = s.d > 0 ? (s.d - s.t).toFixed(1) + " s left" : "";
      if (s.kind === "lab") { state = "Live lab: no animation, take your time"; pct = 100; }
      else if (s.kind !== "video" || !(s.d > 0)) { state = "No animation on this slide"; }
      else if (s.loop) { cls = "loop"; state = "Looping: move on whenever you're ready"; pct = 100 * s.t / s.d; }
      else if (s.ended || s.t >= s.d - 0.05) { cls = "done"; state = "Done: ready for the next slide"; secs = "✓"; pct = 100; }
      else if (s.paused && s.t < 0.05) { cls = "playing"; state = "Starting…"; secs = left; }
      else if (s.paused) { cls = "paused"; state = "Paused (Space to play)"; pct = 100 * s.t / s.d; secs = left; }
      else { cls = "playing"; state = "Animation playing"; pct = 100 * s.t / s.d; secs = left; }
      box.className = "anim " + cls;
      $("state").textContent = state;
      $("secs").textContent = secs;
      $("fill").style.width = Math.max(0, Math.min(100, pct)) + "%";
    }

    // Keys and buttons drive the deck.
    document.addEventListener("keydown", (e) => {
      if (e.key === "l" || e.key === "L") { toggleLang(); return; }
      const map = { ArrowRight: "next", PageDown: "next", ArrowLeft: "prev", PageUp: "prev",
                    ArrowDown: "down", ArrowUp: "up", " ": "toggle" };
      if (map[e.key]) { e.preventDefault(); send(map[e.key]); }
    });
    $("go").onclick = () => send("next");
    $("prev").onclick = () => send("prev");
    $("down").onclick = () => send("down");
    $("toggle").onclick = () => send("toggle");
    $("lang").onclick = toggleLang;

    // Timer and clock.
    let t0 = Date.now();
    $("reset").onclick = () => { t0 = Date.now(); };
    setInterval(() => {
      const s = Math.floor((Date.now() - t0) / 1000);
      $("timer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      if (deck && deck.closed) $("lost").classList.add("show");
    }, 250);

    send("hello");
  })();
  </script>
</body>
</html>
